[build-system]
requires = [
  "scikit-build-core>=0.10",
  "pybind11>=2.11",
  "numpy>=1.23"
]
build-backend = "scikit_build_core.build"

[project]
name = "pclpybridge"
version = "0.1.0"
description = "Small NumPy/Open3D-friendly Python bindings for selected PCL algorithms"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["numpy>=1.23"]

[tool.scikit-build]
cmake.version = ">=3.18"
wheel.packages = ["python/pclpybridge"]
build-dir = "build/{wheel_tag}"
