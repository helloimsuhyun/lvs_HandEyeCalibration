[metadata]
name = handeye-mujoco
version = 0.1.0
description = URDF + sensor CAD + hand-eye transform to collision-aware MuJoCo
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9
install_requires =
    mujoco>=3.2,<4
    numpy>=1.21
    PyYAML>=6

[options.packages.find]
where = src

[options.extras_require]
cad =
    cadquery>=2.4,<3
test =
    pytest>=6

[options.entry_points]
console_scripts =
    handeye-mujoco = handeye_mujoco.cli:main
