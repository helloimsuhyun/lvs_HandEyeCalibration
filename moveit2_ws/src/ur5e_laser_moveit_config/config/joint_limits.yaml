# Conservative application-level limits, intentionally matching the RB5
# planning configuration. The URDF/controller still enforces its own limits.
joint_limits:
  shoulder_pan_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  shoulder_lift_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  elbow_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  wrist_1_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  wrist_2_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
  wrist_3_joint: {has_velocity_limits: true, max_velocity: 0.35, has_acceleration_limits: true, max_acceleration: 0.5}
